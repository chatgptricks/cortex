services:
  - type: worker
    name: cortex-ingestion-worker
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r backend/requirements-server.txt
    startCommand: cd backend && python -m app.worker
    envVars:
      - key: SENTIENT_DATA_DIR
        value: /tmp/sentient-worker-data
      - key: DATABASE_URL
        sync: false
      - key: SENTIENT_SCHEDULER_ENABLED
        value: "true"
      - key: R2_MEDIA_ENABLED
        value: "true"
      - key: R2_ENDPOINT_URL
        value: https://740fd37c6a7741c5b502263b1f31f508.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: SENTIENT_OCR_URL
        sync: false
      - key: SENTIENT_OCR_TOKEN
        sync: false
  - type: web
    name: cortex-api
    runtime: python
    plan: standard
    buildCommand: pip install -r backend/requirements-server.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SENTIENT_DATA_DIR
        value: /tmp/sentient-api-data
      - key: SENTIENT_ALLOWED_ORIGINS
        sync: false # extra CORS origins, comma-separated
      - key: SENTIENT_WEB_RUN_SCHEDULER
        value: "false"
      - key: SENTIENT_WEB_RUN_STARTUP_MAINTENANCE
        value: "false"
      - key: R2_MEDIA_ENABLED
        value: "true"
      - key: R2_ENDPOINT_URL
        value: https://740fd37c6a7741c5b502263b1f31f508.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: TRICKS_DASH_REFRESH_PASSWORD
        sync: false
      - key: SENTIENT_OCR_URL
        sync: false
      - key: SENTIENT_OCR_TOKEN
        sync: false
