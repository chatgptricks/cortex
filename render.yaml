services:
  - type: web
    name: cortex-api
    runtime: python
    plan: standard
    buildCommand: pip install -r backend/requirements-server.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: cortex-data
      mountPath: /var/data
      # This disk already exists at 50 GB in Render. Keep the Blueprint aligned
      # with production so configuration syncs do not attempt an unsupported shrink.
      sizeGB: 50
    envVars:
      - key: PREDICT_DATA_DIR
        value: /var/data
      - key: PREDICT_ALLOWED_ORIGINS
        sync: false # extra CORS origins, comma-separated
      - key: R2_BACKFILL_ENABLED
        value: "true"
      - key: R2_BACKFILL_BATCH_SIZE
        value: "150"
      - key: R2_BACKFILL_INTERVAL_SECONDS
        value: "60"
      - key: R2_LOCAL_MIRROR_ENABLED
        value: "false"
      - key: TRICKS_DASH_REFRESH_PASSWORD
        sync: false
      - key: SENTIENT_OCR_URL
        sync: false
      - key: SENTIENT_OCR_TOKEN
        sync: false
